
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#151b16">

    <title>Valheim Kampung Server</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;

            font-family: Georgia, 'Times New Roman', serif;
            color: #eee8d5;

            background:
                linear-gradient(
                    rgba(12, 19, 14, 0.68),
                    rgba(12, 19, 14, 0.85)
                ),
                url("https://img2.storyblok.com/fit-in/1000x700/f/157036/2132x1194/3754a641ab/carousel-bg.jpg")
                center center / cover fixed no-repeat;

            background-color: #151b16;
        }

        .card {
            width: 100%;
            max-width: 540px;
            padding: 55px 35px;
            text-align: center;

            background: rgba(21, 29, 22, 0.88);
            border: 1px solid rgba(190, 157, 91, 0.55);
            border-radius: 5px;

            box-shadow:
                0 20px 70px rgba(0, 0, 0, 0.55),
                inset 0 0 40px rgba(0, 0, 0, 0.2);

            backdrop-filter: blur(8px);
        }

        .rune {
            color: #c6a66b;
            font-size: 32px;
            margin-bottom: 18px;
            letter-spacing: 8px;
        }

        .eyebrow {
            color: #b7a57b;
            font-size: 11px;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        h1 {
            font-size: clamp(30px, 7vw, 43px);
            font-weight: normal;
            line-height: 1.2;
            margin: 0;
            color: #e8d8ad;
            text-shadow: 0 3px 15px #000;
        }

        .divider {
            width: 100px;
            height: 1px;
            background: #a68a52;
            margin: 27px auto;
        }

        .description {
            color: #c4c0ae;
            font-size: 15px;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        .connect-button {
            display: inline-block;
            padding: 16px 35px;

            background: linear-gradient(
                135deg,
                #9b793e,
                #73552d
            );

            border: 1px solid #c5a568;
            border-radius: 3px;

            color: #fff4d7;
            text-decoration: none;
            font-family: Georgia, serif;
            font-size: 15px;
            letter-spacing: 2px;
            text-transform: uppercase;

            transition: all 0.25s ease;
        }

        .connect-button:hover {
            background: linear-gradient(
                135deg,
                #b18e50,
                #8b6936
            );
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
        }

        .server-info {
            margin-top: 30px;
            padding-top: 22px;
            border-top: 1px solid rgba(190, 157, 91, 0.25);
            color: #aaa995;
            font-size: 12px;
            line-height: 2;
            letter-spacing: 1px;
        }

        .server-info strong {
            color: #d5c39a;
            font-weight: normal;
        }

        .footer {
            margin-top: 28px;
            color: #777d6e;
            font-size: 11px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        @media (max-width: 480px) {
            .card {
                padding: 40px 22px;
            }
        }
    </style>
</head>

<body>

    <main class="card">

        <div class="rune">ᛟ ᚠ ᛟ</div>

        <div class="eyebrow">
            Welcome, Viking
        </div>

        <h1>Valheim<br>Kampung Server</h1>

        <div class="divider"></div>

        <p class="description">
            Beyond the tenth world lies our little kampung.<br>
            Gather your kin, sharpen your axes,<br>
            and prepare for the journey ahead.
        </p>

        <a
            class="connect-button"
            href="steam://run/892970//+connect%20192.168.100.99:2456"
        >
            ⚔ Enter the Realm
        </a>

        <div class="server-info">
            SERVER<br>
            <strong>Valheim Dedicated Server</strong>
            <br>
            SERVER ADDRESS<br>
            <strong>192.168.100.99:2456</strong>
        </div>

        <div class="footer">
            May Odin guide your journey
        </div>

    </main>

</body>
</html>
